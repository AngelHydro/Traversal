<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traversal</title>
<style>
  :root { --bg: #dfe9f3; --panel: rgba(255,255,255,.9); --text: #1a1a1a; --accent: #cc0000; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  #view { position: fixed; inset: 0; }
  #panel { position: fixed; top: 12px; left: 12px; right: 12px; max-width: 420px; padding: 10px 12px;
    background: var(--panel); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #panel h1 { font-size: 17px; margin: 0; width: 100%; }
  select, button { font: inherit; padding: 4px 8px; }
  #status { width: 100%; font-weight: 600; }
  #status.win { color: var(--accent); }
  #captures { width: 100%; font-size: 13px; color: #444; }
  #error { position: fixed; bottom: 12px; left: 12px; right: 12px; padding: 10px; background: #fee; color: #900; border-radius: 6px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>Traversal</h1>
  <select id="landscape" aria-label="Terrain"></select>
  <button id="new">Nouvelle partie</button>
  <div id="status"></div>
  <div id="captures"></div>
</div>
<noscript><div>Ce jeu nécessite JavaScript.</div></noscript>
<div id="error" hidden>Impossible de charger le jeu (connexion au CDN ?)</div>
<script>
  window.onerror = () => { document.getElementById('error').hidden = false; };
</script>
<script type="module" src="./web/main.js" onerror="document.getElementById('error').hidden = false"></script>
</body>
</html>
